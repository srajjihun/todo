<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>캘린더 · 할 일 위젯</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="widget">
    <header class="titlebar">
      <nav class="tabs">
        <button class="tab active" data-tab="calendar">캘린더</button>
        <button class="tab" data-tab="todo">할 일</button>
        <button class="tab" data-tab="focus">포커스</button>
      </nav>
      <div class="win-controls">
        <button id="btn-pin" class="icon-btn" title="최상단 고정">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76V7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3.76a2 2 0 0 0 .59 1.42l1.7 1.7a1 1 0 0 1-.7 1.71H6.41a1 1 0 0 1-.7-1.7l1.7-1.71a2 2 0 0 0 .59-1.42Z"/></svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="설정">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="btn-hide" class="icon-btn" title="숨기기 (트레이에서 복원)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </header>

    <main class="content">
      <section id="view-calendar" class="view"></section>
      <section id="view-todo" class="view hidden"></section>
      <section id="view-focus" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
    </main>

    <footer class="statusbar">
      <button id="btn-sync" class="icon-btn" title="지금 동기화">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
      <span id="status-text">준비 중…</span>
    </footer>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="util.js"></script>
  <script src="date-logic.js"></script>
  <script src="calendar-view.js"></script>
  <script src="todo-view.js"></script>
  <script src="focus-view.js"></script>
  <script src="settings-view.js"></script>
  <script src="app.js"></script>
</body>
</html>
